name: Post to Instagram

on:
  schedule:
    # Times are in UTC, chosen so each region gets a post in its evening.
    - cron: "7 13 * * *"   # 18:37 India, 13:07 UK, 08:07 US East
    - cron: "7 1 * * *"    # 20:07 US East, 17:07 US West, 06:37 India
  # Committing a post id (or the word "next") into .github/run-post starts a run.
  # This lets a Claude session, which can push but cannot press buttons, post on request.
  push:
    branches: [main]
    paths: [".github/run-post"]
  workflow_dispatch:
    inputs:
      id:
        description: "Post id from posts.json (leave empty for a random unposted one)"
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the bot
        run: go build -o "$RUNNER_TEMP/quotebot" ./cmd/quotebot

      - name: Pick a post and draw its slides
        run: |
          set -o pipefail
          if [ "$EVENT" = "push" ]; then POST_ID="$(tr -d '[:space:]' < .github/run-post)"; fi
          if [ "$POST_ID" = "next" ]; then POST_ID=""; fi
          "$RUNNER_TEMP/quotebot" render ${POST_ID:+-id "$POST_ID"} 2>&1 | tee "$RUNNER_TEMP/run.log"
        env:
          EVENT: ${{ github.event_name }}
          POST_ID: ${{ inputs.id }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}

      - name: Push the slides so Instagram can download them
        run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          git add -A out
          git commit -m "Add slides" || echo "Nothing new to commit"
          git pull --rebase
          git push

      - name: Publish to Instagram
        run: |
          set -o pipefail
          "$RUNNER_TEMP/quotebot" publish 2>&1 | tee -a "$RUNNER_TEMP/run.log"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}

      - name: Record the post so it is never repeated
        run: |
          git rm -q --ignore-unmatch last-error.log
          git add posted.json
          git commit -m "Record post"
          git pull --rebase
          git push

      - name: On failure, save the error where it can be read
        if: failure()
        run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          { echo "Failed post run on $(date -u +%Y-%m-%dT%H:%MZ)"; echo; tail -n 60 "$RUNNER_TEMP/run.log" 2>/dev/null || echo "The run failed before the bot produced any output."; } > last-error.log
          git add last-error.log
          git commit -m "Save error from failed run" || true
          git pull --rebase || true
          git push || true
