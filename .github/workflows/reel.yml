name: Make a Reel

# Turns a multi-slide post into a short animated vertical video. By default it
# only makes the file, for you to post from the Instagram app with your own
# music: Instagram's API cannot attach a song.
on:
  # No schedule: Reels are made only when started by hand (or by a commit, below).
  # Committing a post id (or the word "next") into .github/run-reel starts a run.
  # This lets a Claude session, which can push but cannot press buttons, reel on request.
  push:
    branches: [main]
    paths: [".github/run-reel"]
  workflow_dispatch:
    inputs:
      id:
        description: "Post id from posts.json (leave empty for a random unposted one)"
        required: false
      publish:
        description: "Let the bot publish it, silent? Choose no to post it yourself with music"
        type: choice
        options: ["no", "yes"]
        default: "no"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the bot
        run: go build -o "$RUNNER_TEMP/quotebot" ./cmd/quotebot

      - name: Install the video encoder if it is missing
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Draw the slides and build the video
        run: |
          set -o pipefail
          if [ "$EVENT" = "push" ]; then POST_ID="$(tr -d '[:space:]' < .github/run-reel)"; fi
          if [ "$POST_ID" = "next" ]; then POST_ID=""; fi
          "$RUNNER_TEMP/quotebot" render -reel ${POST_ID:+-id "$POST_ID"} 2>&1 | tee "$RUNNER_TEMP/run.log"
        env:
          EVENT: ${{ github.event_name }}
          POST_ID: ${{ inputs.id }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}

      - name: Save the video and its caption for posting by hand
        if: inputs.publish != 'yes'
        run: |
          VIDEO="$(ls out/*-reel.mp4 | tail -n 1)"
          CAPTION="${VIDEO%.mp4}.txt"
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          "$RUNNER_TEMP/quotebot" record
          git rm -q --ignore-unmatch last-error.log
          git add -A out posted.json
          git commit -m "Add reel to post by hand"
          git pull --rebase
          git push
          {
            echo "## Your Reel is ready"
            echo
            echo "1. Open this link on your phone and save the video: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${VIDEO}"
            echo "2. In Instagram, tap **+**, choose **Reel**, pick the video, and add a song."
            echo "3. Paste this caption:"
            echo
            echo '```'
            cat "$CAPTION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the video as a download
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/*-reel.mp4

      - name: Push the video so Instagram can download it
        if: inputs.publish == 'yes'
        run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          git add -A out
          git commit -m "Add reel" || echo "Nothing new to commit"
          git pull --rebase
          git push

      - name: Publish to Instagram
        if: inputs.publish == 'yes'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/quotebot" publish 2>&1 | tee -a "$RUNNER_TEMP/run.log"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}

      - name: Record the Reel so the post is never repeated
        if: inputs.publish == 'yes'
        run: |
          git rm -q --ignore-unmatch last-error.log
          git add posted.json
          git commit -m "Record reel"
          git pull --rebase
          git push

      - name: On failure, save the error where it can be read
        if: failure()
        run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          { echo "Failed reel run on $(date -u +%Y-%m-%dT%H:%MZ)"; echo; tail -n 60 "$RUNNER_TEMP/run.log" 2>/dev/null || echo "The run failed before the bot produced any output."; } > last-error.log
          git add last-error.log
          git commit -m "Save error from failed run" || true
          git pull --rebase || true
          git push || true
