name: Post a Reel

# Turns the next multi-slide post into a vertical video. Run it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Post id from posts.json (leave empty for a random unposted one)"
        required: false
      publish:
        description: "Publish to Instagram? Choose no to only make the video file"
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install the video encoder if it is missing
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Draw the slides and build the video
        run: python bot.py render --reel ${POST_ID:+--id "$POST_ID"}
        env:
          POST_ID: ${{ inputs.id }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}

      - name: Keep the video as a download
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/*-reel.mp4

      - name: Push the video so Instagram can download it
        if: inputs.publish == 'yes'
        run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          git add -A out posted.json
          git commit -m "Add reel"
          git push

      - name: Publish to Instagram
        if: inputs.publish == 'yes'
        run: python bot.py publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
