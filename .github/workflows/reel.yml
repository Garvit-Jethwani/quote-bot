name: Post a Reel

# Turns a multi-slide post into a vertical video.
on:
  schedule:
    - cron: "37 17 * * *"  # 18:37 Central Europe, 12:37 US East, 23:07 India
  workflow_dispatch:
    inputs:
      id:
        description: "Post id from posts.json (leave empty for a random unposted one)"
        required: false
      publish:
        description: "Publish to Instagram? Choose no to only make the video file"
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the bot
        run: go build -o "$RUNNER_TEMP/quotebot" ./cmd/quotebot

      - name: Install the video encoder if it is missing
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Draw the slides and build the video
        run: |
          "$RUNNER_TEMP/quotebot" render -reel ${POST_ID:+-id "$POST_ID"}
        env:
          POST_ID: ${{ inputs.id }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}

      - name: Keep the video as a download
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/*-reel.mp4

      - name: Push the video so Instagram can download it
        if: inputs.publish != 'no'
        run: |
          git config user.name "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          git add -A out
          git commit -m "Add reel" || echo "Nothing new to commit"
          git pull --rebase
          git push

      - name: Publish to Instagram
        if: inputs.publish != 'no'
        run: |
          "$RUNNER_TEMP/quotebot" publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}

      - name: Record the Reel so the post is never repeated
        if: inputs.publish != 'no'
        run: |
          git add posted.json
          git commit -m "Record reel"
          git pull --rebase
          git push
